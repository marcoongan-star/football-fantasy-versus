services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ffv
      POSTGRES_USER: ffv
      POSTGRES_PASSWORD: ffv_local_only
    ports:
      - "5432:5432"
    volumes:
      - ffv_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ffv -d ffv"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ffv:ffv_local_only@postgres:5432/ffv
      FFV_AUTH_MODE: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ffv_postgres:

